services:
  app:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:${PANEL_PORT:-8797}:8787"]
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      RUNNER_URL: http://runner:8090
      BROWSER_URL: http://browser:8091
      QQ_EXECUTOR: ${QQ_EXECUTOR:-harness}
    volumes: ["state:/state"]
    depends_on:
      runner:
        condition: service_started
      browser:
        condition: service_healthy
    networks: [default, workers]
  runner:
    build: ./runner
    environment:
      GROUP_PROJECT: ${COMPOSE_PROJECT_NAME}
      GROUP_MEMORY_LIMIT: ${GROUP_MEMORY_LIMIT:-4g}
      GROUP_CPU_LIMIT: ${GROUP_CPU_LIMIT:-}
      GROUP_PIDS_LIMIT: ${GROUP_PIDS_LIMIT:-512}
    restart: unless-stopped
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    networks: [workers]
    depends_on:
      sandbox:
        condition: service_completed_successfully
      harness:
        condition: service_completed_successfully
  browser:
    build:
      context: .
      dockerfile: browser/Dockerfile
    restart: unless-stopped
    init: true
    shm_size: 256mb
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [default]
  sandbox:
    build: ./sandbox
    image: qq-superagent-sandbox:local
    entrypoint: ["python","-V"]
    network_mode: none
  harness:
    build:
      context: ./harness
      args: { SANDBOX_BASE: sandbox-base }
      additional_contexts:
        sandbox-base: service:sandbox
    image: qq-superagent-harness:local
    entrypoint: ["node","--version"]
    network_mode: none
networks:
  workers:
    internal: true
volumes:
  state: {}
